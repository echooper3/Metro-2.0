[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"
 
[[redirects]]
  from = "/api/ticketmaster"
  to = "/.netlify/functions/ticketmaster"
  status = 200
 
[[redirects]]
  from = "/api/eventbrite"
  to = "/.netlify/functions/eventbrite"
  status = 200
 
[[redirects]]
  from = "/api/read-sheet"
  to = "/.netlify/functions/read-sheet"
  status = 200

[[redirects]]
  from = "/api/scrape/extract-url"
  to = "/.netlify/functions/scrape-extract-url"
  status = 200

[[redirects]]
  from = "/api/scrape/crawl-source"
  to = "/.netlify/functions/scrape-crawl-source"
  status = 200

[[redirects]]
  from = "/api/scrape/sources"
  to = "/.netlify/functions/scrape-sources"
  status = 200
 
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200